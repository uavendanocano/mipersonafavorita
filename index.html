<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="confetti"></div>
    <div id="light"></div>
    <div class="container" style="margin-top: 5%;">
        <!-- CAJA -->
        <div id="gift" class="gift">
            <div class="lid"></div>
            <div class="box">
                🎁
            </div>
        </div>
        <button id="openGift">
            Ábreme ❤️
        </button>
        <!-- SOBRE -->
        <div id="envelope" class="envelope">
            <div class="envelope-body">
                <div class="flap"></div>
                <div id="seal" class="seal">
                    ❤️
                </div>
            </div>
            <button id="openLetter">
                Abrir carta 💌
            </button>
        </div>
        <!-- CARTA ABIERTA -->
        <div id="letter" class="letter">
            <div class="paper">
                <h2>Para ti ❤️</h2>
                <p id="message"><span id="cursor">|</span></p>
                <div id="signature" class="signature">
                    — Ulises ❤️
                </div>
                <div id="loveBox" class="love-box">
                    <button id="loveButton">
                        ❤️ Presiona aquí
                    </button>
                </div>
            </div>
        </div>
        <div id="loveMessage" class="love-message"></div>
    </div>
    
    <audio id="music" loop>
        <source src="music//kilometros.mp3" type="audio/mpeg">
    </audio>
    <script src="app.js"></script>

</body>
</html>
